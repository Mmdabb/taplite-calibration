name: CI

on:
  push:
  pull_request:

jobs:
  test:
    env:
      TAPLITE_REQUIRE_OPENMP: "1"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    env:
      TAPLITE_REQUIRE_OPENMP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  native-cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S native -B native-cpp-build
          -DTAPLITE_BUILD_PYTHON=OFF
          -DTAPLITE_BUILD_CPP_TESTS=ON
      - run: cmake --build native-cpp-build --config Release --parallel 2
      - run: ctest --test-dir native-cpp-build -C Release --output-on-failure
