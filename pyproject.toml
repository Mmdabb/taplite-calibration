[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "taplite-calibration"
version = "0.3.1"
description = "Self-contained TAPLite assignment, screen-count ODME, and QVDF auto calibration"
readme = "README.md"
authors = [{ name = "Mmdabb" }]
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
  "transportation", "traffic-assignment", "odme", "calibration", "qvdf",
  "taplite", "travel-demand-model",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.4",
  "scipy>=1.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]
publish = ["build>=1", "twine>=5"]
all = ["pytest>=7", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/Mmdabb/taplite-calibration"
Repository = "https://github.com/Mmdabb/taplite-calibration"
Issues = "https://github.com/Mmdabb/taplite-calibration/issues"

[project.scripts]
taplite-calibration = "taplite_calibration.cli:main"
taplite-calibrate = "taplite_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taplite_calibration = ["py.typed", "resources/*.toml", "resources/*.csv"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
